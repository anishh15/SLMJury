# SLMJury Model Configurations
# All judge and student model definitions centralized here

student_models:
  qwen2.5-32b:
    model: "Qwen/Qwen2.5-32B-Instruct-GPTQ-Int8"
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    quantization: "gptq"
  llama3.1-8b:
    model: "meta-llama/Llama-3.1-8B-Instruct"
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_model_len: 32768
  # Wider student panel for the family-bias study (experiments/family_bias)
  deepseek-r1-0528-qwen3-8b:
    model: "deepseek-ai/DeepSeek-R1-0528-Qwen3-8B"
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_model_len: 32768
    dtype: "bfloat16"
    always_thinks: true          # emits <think> tokens like phi4r
  mistral-7b-v0.3:
    model: "mistralai/Mistral-7B-Instruct-v0.3"
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_model_len: 32768
  qwen3-14b-student:
    model: "Qwen/Qwen3-14B"
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_model_len: 32768
    dtype: "bfloat16"
  gemma4-31b-student:
    model: "google/gemma-4-31B-it"
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.90
    max_model_len: 32768
    dtype: "bfloat16"
  glm-4.7-flash:
    model: "zai-org/GLM-4.7-Flash"
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.85
    max_model_len: 32768
    dtype: "bfloat16"
    trust_remote_code: true
  qwen3.5-35b-student:
    model: "Qwen/Qwen3.5-35B-A3B"
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.90
    max_model_len: 32768
    dtype: "bfloat16"
    trust_remote_code: true

# Reference models that score MT-Bench (Together API), for
# scripts/run_mtbench_reference.py. They get the same PROMPT_MTBENCH as the
# SLM judges, so the correlation compares like with like.
reference_models:
  gpt-oss-120b:
    provider: "together"
    model: "openai/gpt-oss-120b"
    api_key_env: "TOGETHER_API_KEY"
    temperature: 0
    max_tokens: 2048
    request_delay: 5
    max_retries: 12
    retry_initial_delay: 5
    retry_max_delay: 120
    timeout: 120
  qwen3.5-397b:
    provider: "together"
    model: "Qwen/Qwen3.5-397B-A17B"
    api_key_env: "TOGETHER_API_KEY"
    temperature: 0
    max_tokens: 2048
    request_delay: 5
    max_retries: 12
    retry_initial_delay: 5
    retry_max_delay: 120
    reasoning:
      enabled: false
    timeout: 120

judge_models:
  # Qwen 2.5 family
  qwen2.5-1.5b:
    model: "Qwen/Qwen2.5-1.5B-Instruct"
    tensor_parallel_size: 1
    max_model_len: 32768
    max_num_seqs: 64
  qwen2.5-3b:
    model: "Qwen/Qwen2.5-3B-Instruct"
    tensor_parallel_size: 1
    max_model_len: 32768
    max_num_seqs: 64
  qwen2.5-7b:
    model: "Qwen/Qwen2.5-7B-Instruct"
    tensor_parallel_size: 2

  # Qwen 3 family (enable_thinking via chat template)
  qwen3-0.6b:
    model: "Qwen/Qwen3-0.6B"
    tensor_parallel_size: 1
    max_model_len: 40960
    enable_thinking: true
    max_num_seqs: 64
  qwen3-1.7b:
    model: "Qwen/Qwen3-1.7B"
    tensor_parallel_size: 1
    max_model_len: 40960
    enable_thinking: true
    max_num_seqs: 64
  qwen3-4b:
    model: "Qwen/Qwen3-4B"
    tensor_parallel_size: 1
    max_model_len: 40960
    enable_thinking: true
    max_num_seqs: 64
  qwen3-8b:
    model: "Qwen/Qwen3-8B"
    tensor_parallel_size: 2
    max_model_len: 32768
    enable_thinking: true
  qwen3-14b:
    model: "Qwen/Qwen3-14B"
    tensor_parallel_size: 2
    max_model_len: 32768
    enable_thinking: true

  # Meta Llama family
  llama3.2-1b:
    model: "meta-llama/Llama-3.2-1B-Instruct"
    tensor_parallel_size: 1
    max_model_len: 32768
  llama3.2-3b:
    model: "meta-llama/Llama-3.2-3B-Instruct"
    tensor_parallel_size: 1
    max_model_len: 40960
    max_num_seqs: 64
  llama3.1-8b:
    model: "meta-llama/Llama-3.1-8B-Instruct"
    tensor_parallel_size: 2
    max_model_len: 32768

  # Microsoft Phi-4 family
  phi4-14b:
    model: "microsoft/phi-4"
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_model_len: 16384
  phi4r-14b:
    model: "microsoft/Phi-4-reasoning"
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_model_len: 32768
    max_num_seqs: 3
    enable_thinking: true
    always_thinks: true  # Cannot disable thinking; skip max_tokens=10
  phi4rp-14b:
    model: "microsoft/Phi-4-reasoning-plus"
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_model_len: 32768
    max_num_seqs: 3
    enable_thinking: true
    always_thinks: true
  phi4mi-3.8b:
    model: "microsoft/Phi-4-mini-instruct"
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_model_len: 40960
    max_num_seqs: 64
  phi4mr-3.8b:
    model: "microsoft/Phi-4-mini-reasoning"
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_model_len: 32768
    enable_thinking: true
    always_thinks: true

# Large judges (70B to 122B) and the Qwen3-32B ladder judge (experiments/large_judges).
# They run through the same scripts as the small judges: run_judge.py and
# run_scoring_judge.py look a key up in judge_models first, then here.
# tensor_parallel_size is the width on 44 GiB GPUs. Quantised checkpoints need
# dtype "auto", because the judge otherwise defaults to float16.
large_judge_models:
  llama3.3-70b:
    model: "meta-llama/Llama-3.3-70B-Instruct"
    tensor_parallel_size: 8
    gpu_memory_utilization: 0.90
    max_model_len: 32768
    dtype: "float16"
    params_b: 70
  deepseek-r1-distill-llama-70b:
    model: "deepseek-ai/DeepSeek-R1-Distill-Llama-70B"
    tensor_parallel_size: 8
    gpu_memory_utilization: 0.90
    max_model_len: 32768
    dtype: "bfloat16"
    params_b: 70
    enable_thinking: true
    always_thinks: true   # the template always opens a <think> block; B=8192 only
  qwen2.5-72b:
    model: "Qwen/Qwen2.5-72B-Instruct"
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.90
    max_model_len: 32768
    dtype: "bfloat16"
    trust_remote_code: true
    params_b: 72
  glm-4.5-air:
    model: "zai-org/GLM-4.5-Air-FP8"
    tensor_parallel_size: 8
    gpu_memory_utilization: 0.90
    max_model_len: 32768
    dtype: "auto"
    trust_remote_code: true
    params_b: 106
    active_params_b: 12
    enable_thinking: true
    always_thinks: true   # has a thinking switch, but is evaluated at B=8192 only
  gpt-oss-120b:
    model: "openai/gpt-oss-120b"
    tensor_parallel_size: 8
    gpu_memory_utilization: 0.92
    max_model_len: 32768
    dtype: "auto"
    params_b: 120
    always_thinks: true   # reasons in its own channels; decoded greedily at B=8192
  qwen3.5-122b:
    model: "Qwen/Qwen3.5-122B-A10B-FP8"
    tensor_parallel_size: 8
    gpu_memory_utilization: 0.90
    max_model_len: 32768
    dtype: "auto"
    trust_remote_code: true
    params_b: 122
    active_params_b: 10
    enable_thinking: true
  qwen3-32b:
    model: "Qwen/Qwen3-32B"
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.90
    max_model_len: 32768
    dtype: "bfloat16"
    params_b: 32
    enable_thinking: true
    ladder: true          # the one Qwen3 size between the small and large judges

# Datasets supported
datasets:
  # Closed-ended (verdict: Correct/Incorrect)
  - gsm8k
  - gsm_plus
  - math
  - arc_easy
  - arc_challenge
  - hellaswag
  - winogrande
  - truthfulqa
  # Open-ended (scoring: 1-5)
  - summeval
  - mtbench

# Token settings for judge evaluation
token_settings:
  quick:
    max_tokens: 10
    description: "Direct verdict only (Correct/Incorrect)"
  reasoned:
    max_tokens: 8192
    description: "Reasoning + boxed verdict"

# Open-ended evaluation settings
open_ended_settings:
  score_scale: 5          # 1-5 for both datasets
  binary_threshold: 4     # ≥4 = GOOD for Cohen's κ
  summeval_dimensions:
    - coherence
    - consistency
    - fluency
    - relevance

# Top-5 judges the juries (majority voting) are drawn from (from individual evaluation results)
# Ranked by overall accuracy across 8 datasets
ensemble_judges:
  - key: "phi4-14b"
    tokens: 10
  - key: "qwen3-14b"
    tokens: 10
  - key: "qwen3-8b"
    tokens: 10
  - key: "phi4rp-14b"
    tokens: 8192
  - key: "phi4r-14b"
    tokens: 8192

# Persona prompts are defined in slmjury/strategies/persona.py
# They use exact triple-quoted strings to preserve original whitespace.
# Available: Strict, Lenient, Industry, Logic, Safety, Helpfulness

