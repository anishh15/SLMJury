<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020610"/>
    <stop offset="100%" stop-color="#040a18"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0077FF"/>
    <stop offset="100%" stop-color="#00B4D8"/>
  </linearGradient>
  <radialGradient id="orb" cx="45%" cy="40%" r="50%">
    <stop offset="0%" stop-color="#fff" stop-opacity=".9"/>
    <stop offset="20%" stop-color="#90CAF9"/>
    <stop offset="45%" stop-color="#0077FF"/>
    <stop offset="70%" stop-color="#002855" stop-opacity=".6"/>
    <stop offset="100%" stop-color="#020610" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0077FF" stop-opacity=".30"/>
    <stop offset="50%" stop-color="#0077FF" stop-opacity=".06"/>
    <stop offset="100%" stop-color="#0077FF" stop-opacity="0"/>
  </radialGradient>
  <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
  </filter>
</defs>

<!-- Background -->
<circle cx="60" cy="60" r="58" fill="url(#bg)" stroke="url(#ring)" stroke-width="1.2" opacity=".8"/>

<!-- Glow -->
<circle cx="60" cy="60" r="40" fill="url(#glow)" filter="url(#bloom)"/>

<!-- Hex ring -->
<polygon points="90,60 75,86 45,86 30,60 45,34 75,34"
         fill="none" stroke="url(#ring)" stroke-width=".8"
         stroke-dasharray="16 12" opacity=".25">
  <animateTransform attributeName="transform" type="rotate"
    from="0 60 60" to="360 60 60" dur="20s" repeatCount="indefinite"/>
</polygon>

<!-- Inner hex -->
<polygon points="82,60 71,79 49,79 38,60 49,41 71,41"
         fill="none" stroke="#00B4D8" stroke-width=".6"
         stroke-dasharray="10 16" opacity=".18">
  <animateTransform attributeName="transform" type="rotate"
    from="0 60 60" to="-360 60 60" dur="14s" repeatCount="indefinite"/>
</polygon>

<!-- Orb -->
<circle cx="60" cy="60" r="22" fill="url(#orb)"/>
<circle cx="60" cy="60" r="22" fill="none" stroke="#00B4D8" stroke-width=".5" opacity=".25"/>
<ellipse cx="57" cy="50" rx="5" ry="3" fill="#fff" opacity=".14"/>

<!-- Scale icon (judge) -->
<g transform="translate(60,60)" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".85">
  <!-- Beam -->
  <line x1="-10" y1="-2" x2="10" y2="-2"/>
  <!-- Pillar -->
  <line x1="0" y1="-2" x2="0" y2="8"/>
  <!-- Base -->
  <line x1="-5" y1="8" x2="5" y2="8"/>
  <!-- Left pan -->
  <path d="M-10,-2 L-13,5 L-7,5 Z" fill="#fff" opacity=".5"/>
  <!-- Right pan -->
  <path d="M10,-2 L7,5 L13,5 Z" fill="#fff" opacity=".5"/>
</g>
</svg>
