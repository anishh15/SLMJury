name: tests

# The unit tests need only the parsers, configs and analysis code, so this
# installs their few dependencies instead of the package's GPU stack
# (torch, transformers, vLLM).
on:
  push:
    paths-ignore:
      - 'website/**'
  pull_request:
    paths-ignore:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml "sympy==1.13.1" "antlr4-python3-runtime==4.11.*"

      - name: Run the unit tests
        run: python -m pytest tests -q
